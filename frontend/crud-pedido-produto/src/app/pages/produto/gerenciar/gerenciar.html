<p-table [value]="produtos">
  <ng-template pTemplate="header">
    <tr>
      <th>Nome</th>
      <th>Preço</th>
      <th>Ações</th>
    </tr>
  </ng-template>
  
  <ng-template pTemplate="body" let-produto>
    <tr>
      <td>{{ produto.nome }}</td>
      <td>{{ produto.preco }}</td>
      <td>
        <!-- botões editar/deletar vão aqui -->
      </td>
    </tr>
  </ng-template>
</p-table>
